name: Build Android APK + AAB (debug + optional signed release)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # Optional release signing: set these repository secrets to also build a signed release APK.
      # Without them the workflow keeps producing only the debug APK.
      HAS_RELEASE_KEY: ${{ secrets.HARAQ_KEYSTORE_BASE64 != '' && secrets.HARAQ_KEYSTORE_PASSWORD != '' && secrets.HARAQ_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          wget -q "${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d /tmp/godot-templates
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          cp /tmp/godot-templates/templates/* "$TPL/"
          godot --version

      - name: Configure Godot editor settings for Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
          } > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Generate debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import

      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/haraq-debug.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: haraq-debug-apk
          path: build/haraq-debug.apk
          if-no-files-found: error

      - name: Decode release keystore (optional)
        if: env.HAS_RELEASE_KEY == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HARAQ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ls -la "$RUNNER_TEMP/release.keystore"

      - name: Export signed release APK (optional)
        if: env.HAS_RELEASE_KEY == 'true'
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.HARAQ_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.HARAQ_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Android" build/haraq-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/haraq-release.apk | head -5
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -la build

      - name: Upload release APK (optional)
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: haraq-release-apk
          path: build/haraq-release.apk
          if-no-files-found: error

      - name: Release signing status
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "No HARAQ_KEYSTORE_* secrets set — built the debug APK only (see RELEASE_SIGNING_AR.md)."

  # Separate job so the APK job above stays green even if the Gradle/AAB build has a problem.
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      HAS_RELEASE_KEY: ${{ secrets.HARAQ_KEYSTORE_BASE64 != '' && secrets.HARAQ_KEYSTORE_PASSWORD != '' && secrets.HARAQ_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          wget -q "${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d /tmp/godot-templates
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          cp /tmp/godot-templates/templates/* "$TPL/"

      - name: Configure Godot editor settings for Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
          } > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Install the Android Gradle build template (needed for .aab)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          printf '%s' "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          chmod +x android/build/gradlew

      - name: Generate debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        shell: bash
        run: godot --headless --path . --import

      - name: Export debug AAB
        if: env.HAS_RELEASE_KEY != 'true'
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android AAB" build/haraq-debug.aab
          test -s build/haraq-debug.aab
          ls -la build

      - name: Upload debug AAB
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: haraq-debug-aab
          path: build/haraq-debug.aab
          if-no-files-found: error

      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HARAQ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Export signed release AAB (for Google Play)
        if: env.HAS_RELEASE_KEY == 'true'
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.HARAQ_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.HARAQ_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release "Android AAB" build/haraq-release.aab
          test -s build/haraq-release.aab
          jarsigner -verify build/haraq-release.aab | tail -2
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -la build

      - name: Upload release AAB
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: haraq-release-aab
          path: build/haraq-release.aab
          if-no-files-found: error

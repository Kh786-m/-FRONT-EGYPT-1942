name: Build Godot 3D Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import and export game
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" debug.keystore
          godot --headless --path . --editor --quit
          mkdir -p build
          godot --headless --path . --export-debug Android build/WAR_FRONT_EGYPT_1942_debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WAR_FRONT_EGYPT_1942_Godot3D_APK
          path: build/WAR_FRONT_EGYPT_1942_debug.apk
          if-no-files-found: error
